name: Read-only Production automation runtime verification
on:
  push:
    branches: [release/growth-automation-20261017]
    paths: ['.github/workflows/growth-automation-runtime-verification.yml', 'scripts/verify-growth-runtime.py']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      REQUIRE_REAL_CLOSE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          name: growth-automation-production-39042649307
          run-id: 39042649307
          github-token: ${{ github.token }}
          path: downloaded-backup
      - name: Authenticate and rehearse decryption of the real Production backup
        run: |
          node scripts/decrypt-automation-evidence.mjs downloaded-backup/3ON-automation-evidence.aesgcm /tmp/production-backup.zip
          python -c "import zipfile; zipfile.ZipFile('/tmp/production-backup.zip').extractall('restored-backup')"
      - name: Read Production D1 and verify existing and automatic data
        run: python scripts/verify-growth-runtime.py verify production
      - name: Encrypt private verification evidence
        if: always()
        run: node scripts/encrypt-automation-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: growth-automation-runtime-${{ github.run_id }}
          path: automation-encrypted/
          retention-days: 30
