name: Deploy validated independent growth automation to Production
on:
  push:
    branches: [release/growth-automation-20261017]
    paths: ['.github/workflows/growth-automation-production.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: cloudflare-production-growth-repair
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VALIDATED_SOURCE_SHA: c784871ea891c2810b401d57f0f713d9b8c35a7a
    steps:
      - name: Require successful exact-source Staging validation
        env:
          GH_VALIDATION_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          url='https://api.github.com/repos/smasssss/3on-guild-next/actions/runs?branch=feat/growth-automation-20261017&per_page=10'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_VALIDATION_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r:runs=json.load(r)['workflow_runs']
          valid=[r for r in runs if r['head_sha']==os.environ['VALIDATED_SOURCE_SHA'] and r['conclusion']=='success' and r['name']=='Verify growth automation on existing Staging']
          assert valid,'Exact source has not passed Staging; Production is untouched'
          print('Exact tested Staging commit approved by successful run',valid[0]['id'])
          PY
      - uses: actions/checkout@v6
        with:
          ref: c784871ea891c2810b401d57f0f713d9b8c35a7a
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Back up current Production and rehearse business-data recovery
        run: python scripts/growth-automation-release.py inspect production
      - name: Install existing locked dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Verify the exact release source
        run: |
          npx tsc --noEmit
          node tests/growth_auto_ui_regression.cjs
          node tests/growth_automation_regression.cjs
          node tests/growth_changes_regression.cjs
          node tests/production_growth_regression.cjs
          node tests/canyon_latest_regression.cjs
      - name: Apply additive automation tables without enabling collection
        run: python scripts/growth-automation-release.py prepare production
      - name: Build and verify existing operation functions
        run: |
          npm run build
          python tests/automation_operations_preserved.py
      - name: Deploy the tested Worker with one combined hourly and 00:10 KST schedule
        run: npx wrangler deploy --config wrangler.automation.generated.json --strict
      - name: Verify Production schedules, public APIs and unchanged saved data
        run: python scripts/growth-automation-release.py verify production
      - name: Encrypt business backup and verification evidence
        if: always()
        run: node scripts/encrypt-automation-evidence.mjs
      - name: Preserve encrypted Production recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-automation-production-${{ github.run_id }}
          path: automation-encrypted/
          retention-days: 30
          if-no-files-found: warn
