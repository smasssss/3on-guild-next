name: D1 read usage report (analytics only, no database rows read)
# 2026-11-06: user asked why D1 rows read exceeded the daily limit. This only asks Cloudflare's
# query analytics which queries read the most rows; it never queries or changes the databases.
# Rerun 1: hourly rows-read totals per database.
on:
  push:
    branches: [claude/new-session-narazy]
    paths: ['.github/workflows/d1-insights.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Top queries by rows read (last 1 day and last 6 hours)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: false
        run: |
          for db in 3on-guild-production-db 3on-guild-staging-db; do
            for period in 1d 6h; do
              echo "=== $db $period ==="
              npx --no-install wrangler d1 insights "$db" --time-period "$period" --sort-by reads --sort-type sum --limit 12 --json > out.json || { echo "insights unavailable"; continue; }
              node -e '
                const rows=JSON.parse(require("fs").readFileSync("out.json","utf8"));
                for(const r of rows){const q=String(r.query||"").replace(/\s+/g," ").slice(0,260);
                  console.log([r.totalRowsRead,r.numberOfTimesRun,r.avgRowsRead,q].join(" | "));}'
            done
          done
      - name: Rows read per hour for each database (last 26 hours, UTC)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            const since=new Date(Date.now()-26*3600e3).toISOString(),until=new Date().toISOString();
            const query=`query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{datetimeHour_geq:$s,datetimeHour_leq:$u},orderBy:[datetimeHour_ASC]){sum{rowsRead readQueries rowsWritten}dimensions{datetimeHour databaseId}}}}}`;
            fetch("https://api.cloudflare.com/client/v4/graphql",{method:"POST",headers:{"Authorization":"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({query,variables:{a:process.env.CLOUDFLARE_ACCOUNT_ID,s:since,u:until}})})
            .then(r=>r.json()).then(j=>{if(j.errors){console.log("graphql errors:",JSON.stringify(j.errors).slice(0,400));return;}
              const names={"31e3bbb6-2860-40cb-9390-d989d37f11c2":"production","9c3667a6-e510-40a6-b4e6-4852515fdb3a":"staging"};
              for(const g of j.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups)console.log(g.dimensions.datetimeHour,names[g.dimensions.databaseId]||"other",g.sum.rowsRead,g.sum.readQueries,g.sum.rowsWritten);});'
