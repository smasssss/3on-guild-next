name: D1 read usage report (analytics only, no database rows read)
# 2026-11-06: user asked why D1 rows read exceeded the daily limit. This only asks Cloudflare's
# query analytics which queries read the most rows; it never queries or changes the databases.
# Rerun 1: hourly rows-read totals per database.
# Rerun 2: per-query rows read inside the 2026-11-06 15:00-16:00 UTC spike.
# Rerun 3: minute-by-minute rows read in that hour, and the same hour on 2026-11-04/05.
# Rerun 4: the 2026-11-08 02:30-02:45 UTC weekly-points import window.
on:
  push:
    branches: [claude/new-session-narazy]
    paths: ['.github/workflows/d1-insights.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Top queries by rows read (last 1 day and last 6 hours)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_SEND_METRICS: false
        run: |
          for db in 3on-guild-production-db 3on-guild-staging-db; do
            for period in 1d 6h; do
              echo "=== $db $period ==="
              npx --no-install wrangler d1 insights "$db" --time-period "$period" --sort-by reads --sort-type sum --limit 12 --json > out.json || { echo "insights unavailable"; continue; }
              node -e '
                const rows=JSON.parse(require("fs").readFileSync("out.json","utf8"));
                for(const r of rows){const q=String(r.query||"").replace(/\s+/g," ").slice(0,260);
                  console.log([r.totalRowsRead,r.numberOfTimesRun,r.avgRowsRead,q].join(" | "));}'
            done
          done
      - name: Rows read per hour for each database (last 26 hours, UTC)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            const since=new Date(Date.now()-26*3600e3).toISOString(),until=new Date().toISOString();
            const query=`query($a:String!,$s:Time!,$u:Time!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{datetimeHour_geq:$s,datetimeHour_leq:$u},orderBy:[datetimeHour_ASC]){sum{rowsRead readQueries rowsWritten}dimensions{datetimeHour databaseId}}}}}`;
            fetch("https://api.cloudflare.com/client/v4/graphql",{method:"POST",headers:{"Authorization":"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({query,variables:{a:process.env.CLOUDFLARE_ACCOUNT_ID,s:since,u:until}})})
            .then(r=>r.json()).then(j=>{if(j.errors){console.log("graphql errors:",JSON.stringify(j.errors).slice(0,400));return;}
              const names={"31e3bbb6-2860-40cb-9390-d989d37f11c2":"production","9c3667a6-e510-40a6-b4e6-4852515fdb3a":"staging"};
              for(const g of j.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups)console.log(g.dimensions.datetimeHour,names[g.dimensions.databaseId]||"other",g.sum.rowsRead,g.sum.readQueries,g.sum.rowsWritten);});'
      - name: Queries inside the 15:00-16:00 UTC spike (production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            const query=`query($a:String!){viewer{accounts(filter:{accountTag:$a}){d1QueriesAdaptiveGroups(limit:50,filter:{datetime_geq:"2026-11-08T02:30:00Z",datetime_leq:"2026-11-08T02:45:00Z",databaseId:"31e3bbb6-2860-40cb-9390-d989d37f11c2"},orderBy:[sum_rowsRead_DESC]){count sum{rowsRead rowsWritten queryDurationMs}dimensions{query error}}}}}`;
            fetch("https://api.cloudflare.com/client/v4/graphql",{method:"POST",headers:{"Authorization":"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({query,variables:{a:process.env.CLOUDFLARE_ACCOUNT_ID}})})
            .then(r=>r.json()).then(j=>{if(j.errors){console.log("graphql errors:",JSON.stringify(j.errors).slice(0,600));return;}
              for(const g of j.data.viewer.accounts[0].d1QueriesAdaptiveGroups)console.log(g.sum.rowsRead,"|",g.count,"|",g.sum.queryDurationMs,"|",String(g.dimensions.error||"").slice(0,80),"|",String(g.dimensions.query).replace(/\s+/g," ").slice(0,400));});'
      - name: Minute-by-minute rows read 15:00-16:00 UTC (production)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node -e '
            const ask=(from,to,dim)=>fetch("https://api.cloudflare.com/client/v4/graphql",{method:"POST",headers:{"Authorization":"Bearer "+process.env.CLOUDFLARE_API_TOKEN,"Content-Type":"application/json"},body:JSON.stringify({query:`query($a:String!){viewer{accounts(filter:{accountTag:$a}){d1AnalyticsAdaptiveGroups(limit:200,filter:{${dim}_geq:"${from}",${dim}_leq:"${to}",databaseId:"31e3bbb6-2860-40cb-9390-d989d37f11c2"},orderBy:[${dim}_ASC]){sum{rowsRead readQueries rowsWritten}dimensions{${dim}}}}}}`,variables:{a:process.env.CLOUDFLARE_ACCOUNT_ID}})}).then(r=>r.json());
            (async()=>{
              const m=await ask("2026-11-08T02:30:00Z","2026-11-08T02:45:00Z","datetimeMinute");
              if(m.errors)console.log("errors",JSON.stringify(m.errors).slice(0,400));else for(const g of m.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups)if(g.sum.rowsRead>1000)console.log("minute",g.dimensions.datetimeMinute,g.sum.rowsRead,g.sum.readQueries,g.sum.rowsWritten);
              const d=await ask("2026-11-03T00:00:00Z","2026-11-08T02:45:00Z","datetimeHour");
              if(d.errors)console.log("errors",JSON.stringify(d.errors).slice(0,400));else for(const g of d.data.viewer.accounts[0].d1AnalyticsAdaptiveGroups)if(g.sum.rowsRead>500000)console.log("big hour",g.dimensions.datetimeHour,g.sum.rowsRead,g.sum.readQueries);
            })();'
