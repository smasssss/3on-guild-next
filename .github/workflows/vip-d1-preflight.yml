name: Check existing public Worker access without changing access policy
on:
  push:
    branches: [diag/vip-cloudflare-20261028]
    paths: ['.github/workflows/vip-d1-preflight.yml', 'scripts/vip-remote-preflight.py', 'scripts/vip-backup-recipient.pem']
permissions:
  contents: read
jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Classify existing public access failures without logging response bodies
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/vip-remote-preflight.py connection
