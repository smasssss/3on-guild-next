name: Validate current-source UI polish (isolated only)
on:
  push:
    branches: [release/ui-polish-current-20261022]
    paths: [.github/workflows/ui-polish-validate.yml, tests/ui_polish_visual.mjs, app/globals.css]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Require unchanged deployed application sources except approved CSS
        run: |
          git diff --name-only e26a522fd687124a28bdff60b9867e85b147bf9a HEAD -- app lib build public drizzle package.json package-lock.json > /tmp/runtime-diff
          test "$(cat /tmp/runtime-diff)" = app/globals.css
          test "$(git hash-object app/globals.css)" = d6bbfaa146548eb8c55337dba9efbc5cea91b319
      - name: Locked dependencies, source lint, type check and offline regressions
        run: |
          npm ci --include=dev --include=optional --no-audit --no-fund
          npm run lint -- --ignore-pattern tests
          npx tsc --noEmit
          node tests/d1_latest_lookup.cjs
          python tests/d1_snapshot_baseline.py
          node tests/growth_automation_regression.cjs
          node tests/growth_changes_regression.cjs
          node tests/production_growth_regression.cjs
          node tests/growth_auto_ui_regression.cjs
          node tests/carriage_date_regression.cjs
          node tests/canyon_latest_regression.cjs
      - name: Build and verify unchanged operation/authentication functions
        run: |
          npm run build
          python tests/automation_operations_preserved.py
          python tests/vip_exclusions_regression.py
      - name: Install test-only browser driver
        run: |
          npm install --prefix /tmp/3on-browser --no-audit --no-fund --ignore-scripts playwright@1.62.1
          command -v google-chrome
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Actual six-width rendering with synthetic API responses and zero write requests
        env:
          PLAYWRIGHT_MODULE: /tmp/3on-browser/node_modules/playwright/index.mjs
          UI_VISUAL_OUTPUT: /tmp/3on-ui-visual
        run: |
          export CHROME_BIN="$(command -v google-chrome)"
          mkdir -p /tmp/3on-ui-local
          node -e 'const fs=require("node:fs");const c=JSON.parse(fs.readFileSync("dist/server/wrangler.json"));c.main=process.cwd()+"/dist/server/index.js";c.assets.directory=process.cwd()+"/dist/client";c.name="threeon-ui-isolated";c.d1_databases=[];fs.writeFileSync("/tmp/3on-ui-local/wrangler.json",JSON.stringify(c));'
          npx wrangler dev --local --config /tmp/3on-ui-local/wrangler.json --ip 127.0.0.1 --port 8794 --inspector-port 0 > /tmp/3on-ui-local/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://127.0.0.1:8794/growth-admin > /dev/null; then break; fi
            sleep 1
          done
          node tests/ui_polish_visual.mjs
      - name: Save synthetic visual evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3ON-UI-synthetic-visual-${{ github.run_id }}
          path: /tmp/3on-ui-visual/
          if-no-files-found: warn
          retention-days: 3
