name: 3ON Staging D1 backup preflight (no deployment)
on:
  push:
    branches:
      - feature/20261022-safe-ui-polish
    paths:
      - .github/workflows/staging-d1-backup-preflight.yml
permissions:
  contents: read
concurrency:
  group: 3on-staging-preflight
  cancel-in-progress: false
jobs:
  backup-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_NAME: 3on-guild-staging-db
      WORKER_NAME: 3on-guild-staging
      CONFIG_FILE: wrangler.ui-backup-check.json
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Require Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - name: Install pinned project dependencies
        run: npm ci --include=dev --include=optional --no-audit --no-fund
      - name: Find existing staging D1 only (never create)
        id: database
        run: |
          set -euo pipefail
          database_id="$(npx wrangler d1 list --json | jq -r --arg name "$DATABASE_NAME" '.[] | select(.name == $name) | .uuid' | head -n1)"
          test -n "$database_id"
          node scripts/cloudflare-config.mjs "$CONFIG_FILE" "$WORKER_NAME" "$DATABASE_NAME" "$database_id"
          echo "Existing staging database identified."
      - name: Record read-only D1 restore bookmark BEFORE migration
        run: |
          set -euo pipefail
          date -u +"%Y-%m-%dT%H:%M:%SZ" | tee /tmp/3on-ui-backup-utc.txt
          npx wrangler d1 time-travel info "$DATABASE_NAME" --json > /tmp/3on-ui-d1-bookmark.json
          test -s /tmp/3on-ui-d1-bookmark.json
          {
            echo "### Staging D1 preflight restore point"
            echo "Time UTC: $(cat /tmp/3on-ui-backup-utc.txt)"
            echo 'Cloudflare Time Travel (limited retention):'
            echo '~~~json'
            cat /tmp/3on-ui-d1-bookmark.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: List unapplied remote migrations (READ ONLY)
        run: |
          set -euo pipefail
          npx wrangler d1 migrations list DB --remote --config "$CONFIG_FILE" 2>&1 | tee /tmp/3on-ui-migrations.txt
          {
            echo "### Pending remote migrations — review before applying"
            echo '~~~'
            cat /tmp/3on-ui-migrations.txt
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify full SQL export can be generated privately on runner
        run: |
          set -euo pipefail
          npx wrangler d1 export "$DATABASE_NAME" --remote --output /tmp/3on-ui-staging-before.sql --skip-confirmation
          test -s /tmp/3on-ui-staging-before.sql
          sha256sum /tmp/3on-ui-staging-before.sql | awk '{print "SQL export SHA256:", $1}' >> "$GITHUB_STEP_SUMMARY"
          wc -c /tmp/3on-ui-staging-before.sql | awk '{print "SQL export size:", $1, "bytes"}' >> "$GITHUB_STEP_SUMMARY"
          echo "SQL export verified locally on runner only; not published to public repository."
          rm -f /tmp/3on-ui-staging-before.sql
