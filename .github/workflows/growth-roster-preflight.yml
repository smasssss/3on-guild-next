name: Read-only roster repair access and deployment preflight
on:
  push:
    branches: [diag/growth-roster-20261103]
    paths: ['.github/workflows/growth-roster-preflight.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check existing Cloudflare access and deployed versions without changes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python scripts/growth-roster-preflight.py
