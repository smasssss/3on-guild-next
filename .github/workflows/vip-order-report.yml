name: VIP queue report from the live Production page (read-only)
# 2026-11-09: user asked for the VIP order as text for members with 40,000,000+ weekly points.
# Rerun 1: render the real VIP picker after shared records load (counts and order exactly as on screen).
# Rerun 2: read the score line even on the "오늘 추천" row.
# Run 4 (2026-11-16): user reported 1위 got the VIP ride on Sunday 2026-11-15 (not in the records yet).
# Run 3 (2026-11-16): the next 7 days of VIP picks with this week's uploaded points (read-only, in memory).
on:
  push:
    branches: [claude/new-session-narazy]
    paths: ['.github/workflows/vip-order-report.yml']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --ignore-scripts playwright-core@1.56.1
      - name: VIP picks for 2026-11-16 .. 2026-11-22
        run: |
          cp scripts/vip-week-plan.mjs "$RUNNER_TEMP/pw/plan.mjs"
          CHROME_BIN="$(command -v google-chrome)" node "$RUNNER_TEMP/pw/plan.mjs" 2026-11-16 7 "1위=2026-11-15"
