<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>런닝머신 레이스 시험판</title>
<style>html,body{margin:0;height:100%;background:#111;color:#fff;font-family:sans-serif}#stage{position:fixed;inset:0}#lights{position:fixed;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:8px 12px;background:#000a;border-radius:14px}#lights i{width:34px;height:34px;border-radius:50%;background:#400;box-shadow:inset 0 0 8px #000}#lights.red i{background:#ff2a2a;box-shadow:0 0 18px #f00}#lights.green i{background:#1eff5a;box-shadow:0 0 18px #0f0}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-size:26px;font-weight:800;background:#000c;padding:14px 22px;border-radius:16px;border:2px solid #ffc400;color:#ffe27a;display:none;white-space:nowrap}#status{position:fixed;left:10px;bottom:10px;right:10px;font-size:17px;font-weight:700;background:#0008;padding:8px 10px;border-radius:10px}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/","@dimforge/rapier3d-deterministic-compat":"./node_modules/@dimforge/rapier3d-deterministic-compat/dist/rapier.mjs"}}</script>
</head><body><div id="stage"></div><div id="lights"><i></i><i></i><i></i></div><div id="banner"></div><div id="status">준비 중…</div>
<script type="module">
import RAPIER from '@dimforge/rapier3d-deterministic-compat';
import {createRace,pickKinds,MACHINE,HZ} from './sim.mjs';
import {createView} from './render.mjs';
await RAPIER.init();
const q=new URLSearchParams(location.search),seed=q.get('seed')||'1a2b3c4d',n=Number(q.get('n')||15);
const names=['니니','어서³ᴼᴺ','아일리³ᴼᴺ','용팝','두리³ᴼᴺ','제시³ᴼᴺ','핵불잙³ᴼᴺ','키위','HUK333','공 주','Надя696','얼음많이','waweloo','댕댕댕이','야옹이대장'].slice(0,n);
const machine={...MACHINE,...Object.fromEntries((q.get('m')||'').split(',').filter(Boolean).map(kv=>{const [k,v]=kv.split('=');return [k,Number(v)];}))};
const kinds=q.get('kinds')?q.get('kinds').split(','):pickKinds(seed,n,machine.carW??1);
const race=createRace(RAPIER,kinds,seed,machine);
const frames=[],meta=[],every=HZ/60;let k=0;const rec=()=>{if((k++)%every===0){frames.push(Float32Array.from(race.snapshot()));meta.push(race.beltPos);}};
while(!race.finished()&&race.t<Number(q.get('cap')||120)){race.step();rec();}
for(let i=0;i<HZ*2;i++){race.step();rec();}
const order=race.result();
const view=await createView(document.getElementById('stage'),race,names,{highlight:6,machine,cam:q.get('cam')});
addEventListener('resize',()=>view.resize());
window.__frames=frames.length;window.__info={secs:race.t,restarts:race.restarts,winner:names[order.at(-1)],kinds};
const L=document.getElementById('lights'),S=document.getElementById('status'),B=document.getElementById('banner');
let f=Number(q.get('f')||0);const still=q.has('f');
function draw(){const i=Math.min(f,frames.length-1);view.update(frames[i],meta[i]);
 const t=f/60;L.className=t<0.3?'red':'green';L.style.display=t<1.6?'flex':'none';
 const rs=race.events.filter(e=>e.type==='restart').map(e=>e.frame/every),rr=rs.find(x=>f>=x-20&&f<x+110);B.style.display=rr!=null?'block':'none';if(rr!=null)B.textContent='10초간 탈락 없음 · 남은 선수 재출발!';
 const out=race.entries.filter(e=>e.outAt!=null&&e.outAt/every<=f).sort((a,b)=>b.outAt-a.outAt);
 S.textContent=(n-out.length<=1?'1등: '+names[order.at(-1)]+' · ':'')+'남은 '+(n-out.length)+'명 · 방금 탈락: '+out.slice(0,4).map(e=>names[e.i]).join(', ');}
window.__seek=x=>{f=x;draw();};
if(still){draw();window.__drawn=true;}else{(function loop(){draw();if(f<frames.length-1){f++;}requestAnimationFrame(loop);})();}
</script></body></html>
